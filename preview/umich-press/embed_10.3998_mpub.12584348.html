<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The embed is meant to be framed by a partner page, never to rank as a page of its own. -->
<meta name="robots" content="noindex, nofollow">
<title>BookStories embed</title>
<!--
  BookStories publisher embed — one file, three variants, driven by the JSON in #bs-payload.
  Query params (on the iframe src):
    variant = storyline | audiences | pulse   (default storyline)
    theme   = light | dark | auto             (default light)
    partner = <slug>  utm_*                    appended to every outbound link

<style>
  /* Design tokens mirror the openscience.works story pages (bookstory_<doi>.html):
     ground #f3f4f6 · ink #111827 · muted #6b7280/#64748b · lines #e5e7eb/#e2e8f0 ·
     panels #f8fafc · accent #2563eb · figures #1e40af · brand yellow #F2C94C ·
     card radius .9rem · inner radius .75rem · button radius .45rem.
     No webfonts: the site uses the system stack, and a publisher iframe should make no third-party requests. */
  :root {
    --ink: #111827; --ink-2: #374151; --muted: #6b7280; --muted-2: #64748b;
    --line: #e5e7eb; --line-2: #e2e8f0;
    --blue: #2563eb; --blue-deep: #1e40af; --blue-soft: #eff6ff; --blue-edge: #93c5fd;
    --yellow: #F2C94C; --yellow-soft: #fef9c3; --yellow-edge: #fde68a; --amber: #b45309;
    --green: #166534; --green-soft: #f0fdf4;
    --widget: #ffffff; --panel: #f8fafc;
    --r-card: .9rem; --r-panel: .75rem; --r-btn: .45rem;
  }
  :root[data-theme="dark"] {
    --ink: #e5e7eb; --ink-2: #cbd5e1; --muted: #94a3b8; --muted-2: #94a3b8;
    --line: #2a3145; --line-2: #2a3145;
    --blue: #60a5fa; --blue-deep: #93c5fd; --blue-soft: #1e293b; --blue-edge: #3b82f6;
    --yellow: #F2C94C; --yellow-soft: #422f06; --yellow-edge: #78500a; --amber: #fbbf24;
    --green: #4ade80; --green-soft: #14261a;
    --widget: #111827; --panel: #172033;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --ink: #e5e7eb; --ink-2: #cbd5e1; --muted: #94a3b8; --muted-2: #94a3b8;
      --line: #2a3145; --line-2: #2a3145;
      --blue: #60a5fa; --blue-deep: #93c5fd; --blue-soft: #1e293b; --blue-edge: #3b82f6;
      --yellow: #F2C94C; --yellow-soft: #422f06; --yellow-edge: #78500a; --amber: #fbbf24;
      --green: #4ade80; --green-soft: #14261a;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }

  .bs-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: .65rem .9rem; border-top: 1px solid var(--line); background: var(--panel); }
  .bs-src { font-size: .68rem; color: var(--muted); line-height: 1.45; flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

    .bs-foot { flex-direction: column; align-items: stretch; gap: .5rem; }

  }

  .bar { display: grid; grid-template-rows: 1fr auto; gap: .2rem; justify-items: center; }
  .bar i { display: block; width: 100%; align-self: end; height: var(--h); min-height: 2px; background: var(--blue); border-radius: 3px 3px 0 0; }

  }

  /* C — pulse */
  .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ph .big { font-weight: 700; font-size: 1.25rem; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  .ph .since { font-size: .63rem; color: var(--muted-2); white-space: nowrap; }
  .spark svg { width: 100%; height: 74px; display: block; overflow: visible; margin: .5rem 0 .1rem; }
  .spark .area { fill: var(--blue-soft); }
  .spark .ln { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linejoin: round; }
  .spark .pt { fill: var(--widget); stroke: var(--blue); stroke-width: 2; }
  .spark .pt.last { fill: var(--yellow); stroke: var(--ink); }

  .spark text.v { fill: var(--blue-deep); font-weight: 700; }
  .feed { list-style: none; margin: .5rem 0 0; padding: 0; border-top: 1px solid var(--line); }
  .feed li { display: grid; grid-template-columns: 52px 1fr; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: .78rem; line-height: 1.4; }
  .feed li:last-child { border-bottom: 0; }
  .feed .when { font-size: .63rem; color: var(--muted-2); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .feed .what { color: var(--muted); }
  .feed .what a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .feed .what b { color: var(--ink); font-weight: 600; }
  .feed .what a:hover { text-decoration: underline; }
  .feed .what small { display: block; color: var(--muted-2); font-size: .72rem; }
  .tag { display: inline-block; font-size: .6rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: .1rem .4rem; margin-right: .35rem; vertical-align: 1px; border: 1px solid transparent; }
  .tag.cited { background: var(--blue-soft); color: var(--blue-deep); border-color: var(--blue-edge); }
  .tag.wikipedia { background: var(--yellow-soft); color: var(--amber); border-color: var(--yellow-edge); }
  .tag.course { background: var(--green-soft); color: var(--green); border-color: rgba(22,101,52,.25); }
  @media (min-width: 620px) {
    .pulse .body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.75rem; }
    .pulse .ph, .pulse .spark { grid-column: 1; }
    .pulse .feed { grid-column: 2; grid-row: 1 / span 2; margin-top: 0; border-top: 0; }
  }

  /* low-data state */
  .sparse .big { font-weight: 700; font-size: 1.1rem; line-height: 1.25; margin: 0 0 .4rem; letter-spacing: -.01em; }
  .sparse p { margin: 0 0 .5rem; font-size: .82rem; color: var(--muted); }
  .sparse .have { list-style: none; padding: .6rem .8rem; margin: 0 0 .6rem; display: grid; gap: .35rem; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-panel); }
  .sparse .have li { font-size: .85rem; color: var(--ink-2); }
  .sparse .have li .n { font-size: .68rem; color: var(--muted-2); margin-left: .4rem; }
  .sparse .watch { display: flex; flex-wrap: wrap; gap: .3rem; }
  .sparse .watch span { font-size: .68rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: .12rem .55rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

        idx.textContent = (i + 1) + " / " + P.claims.length;
        cta.innerHTML = esc(c.cta) + ARROW; cta.href = storyUrl(c.route);
        Array.prototype.forEach.call(dots.children, function (d, k2) { d.setAttribute("aria-current", k2 === i ? "true" : "false"); });
        sendHeight();
      }
      function stop() { if (timer) clearInterval(timer); timer = null; }
      function restart() { stop(); if (!reduce) timer = setInterval(function () { show(i + 1); }, 7000); }
      document.getElementById("prev").addEventListener("click", function () { show(i - 1); restart(); });
      document.getElementById("next").addEventListener("click", function () { show(i + 1); restart(); });
      var w = document.querySelector(".bs");
      w.addEventListener("mouseenter", stop); w.addEventListener("mouseleave", restart);
      w.addEventListener("focusin", stop); w.addEventListener("focusout", restart);
      show(0); restart();
    }, 0);
    return html;
  }

  /* ---------- B: audiences ---------- */
  function renderAudiences() {
    var keys = Object.keys(AUD).filter(function (k) { return P.audiences[k] && P.audiences[k].items.length; });
    if (!keys.length) return renderSparse();
    var tabs = '<div class="tabs" role="tablist" aria-label="Audiences">' + keys.map(function (k, n) {
      return '<button role="tab" aria-selected="' + (n === 0) + '" data-pane="' + k + '">' + AUD[k][0] + '</button>';
    }).join("") + '</div>';
    var panes = keys.map(function (k, n) {
      var a = P.audiences[k];
      return '<div class="pane body" id="pane-' + k + '" role="tabpanel"' + (n ? " hidden" : "") + '><p class="lead">' + a.lead_html + '</p><ul class="items">' +
        a.items.map(function (it) {
          var label = it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.label) + '</a>' : '<b>' + esc(it.label) + '</b>';
          return '<li>' + ICONS[k === "researchers" && !it.url ? "inst" : AUD[k][1]] + '<div>' + label + (it.sub ? '<small>' + esc(it.sub) + '</small>' : "") + '</div></li>';
        }).join("") + '</ul></div>';
    }).join("");
    var geo = "";
    if (P.geo.countries.length >= 3) {
      var max = Math.max.apply(null, P.geo.countries.map(function (c) { return c.count; }));
      geo = '<div class="geo"><div class="cap"><span class="label">Citing countries</span><span class="label mono">' + P.geo.total_countries + ' countries</span></div>' +
        '<div class="bars" role="img" aria-label="Citing works by country: ' + P.geo.countries.map(function (c) { return c.label + " " + c.count; }).join(", ") + '">' +
        P.geo.countries.map(function (c) { return '<div class="bar"><i style="--h:' + Math.round(100 * c.count / max) + '%"></i><span class="mono">' + esc(c.code) + ' ' + c.count + '</span></div>'; }).join("") + '</div></div>';
    }
    var kick = P.geo.total_countries >= 3 ? "Read in " + P.geo.total_countries + " countries" : "Who's reading it";
    var first = P.audiences[keys[0]];
    var html = frame(kick, tabs + '<div class="panes"><div>' + panes + '</div>' + geo + '</div>', srcLine, first.cta, first.route, "audiences");
    setTimeout(function () {
      var cta = document.getElementById("cta");
      document.querySelectorAll('[role="tab"]').forEach(function (t) {
        t.addEventListener("click", function () {
          document.querySelectorAll('[role="tab"]').forEach(function (x) { x.setAttribute("aria-selected", "false"); });
          t.setAttribute("aria-selected", "true");
          document.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = p.id !== "pane-" + t.dataset.pane; });
          var a = P.audiences[t.dataset.pane]; cta.innerHTML = esc(a.cta) + ARROW; cta.href = storyUrl(a.route);
          sendHeight();
        });
      });
    }, 0);
    return html;
  }

  /* ---------- C: pulse ---------- */
  function renderPulse() {
    var ys = P.timeline.by_year;
    if (P.timeline.total < 3 && !P.feed.length) return renderSparse();
    var spark = "";
    if (ys.length >= 2) {
      var W = 320, x0 = 14, x1 = 306, max = Math.max.apply(null, ys.map(function (y) { return y.count; })) || 1;
      var pts = ys.map(function (y, i) { return [x0 + (x1 - x0) * i / (ys.length - 1), 12 + 49 * (1 - y.count / max)]; });
      spark = '<div class="spark"><svg viewBox="0 0 ' + W + ' 74" role="img" aria-label="Citing works per year: ' + ys.map(function (y) { return y.year + " " + y.count; }).join(", ") + '">' +
        '<path class="area" d="M' + pts.map(function (p) { return p[0] + "," + p[1]; }).join(" L") + " L" + x1 + ",62 L" + x0 + ',62 Z"/>' +
        '<path class="ln" d="M' + pts.map(function (p) { return p[0] + "," + p[1]; }).join(" L") + '"/>' +
        pts.map(function (p, i) { return '<circle class="pt' + (i === pts.length - 1 ? " last" : "") + '" cx="' + p[0] + '" cy="' + p[1] + '" r="3"/>'; }).join("") +
        pts.map(function (p, i) { return '<text class="v" x="' + p[0] + '" y="' + (p[1] - 7) + '" text-anchor="middle">' + ys[i].count + '</text>'; }).join("") +
        pts.map(function (p, i) { var last = i === pts.length - 1, y = ys[i].year; return '<text x="' + (last ? x1 + 6 : p[0]) + '" y="73" text-anchor="' + (last ? "end" : (i === 0 ? "start" : "middle")) + '">' + (last && y === thisYear ? "'" + String(y).slice(2) + " ytd" : y) + '</text>'; }).join("") + '</svg></div>';
    }
    var first = (P.timeline.by_year[0] || {}).year;
    var headline = !P.timeline.total ? "Being read and discussed."
      : isRecent ? (age >= 2 ? age + " years on, still being cited." : "Already being cited.")
      : (first && lastActive && first !== lastActive ? "Cited from " + first + " to " + lastActive + "." : "A long, quiet tail.");
    var feed = '<ul class="feed">' + P.feed.map(function (f) {
      var t = f.url ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.title) + '</a>' : '<b>' + esc(f.title) + '</b>';
      var tag = { cited: "Cited", wikipedia: "Wikipedia", course: "Taught" }[f.kind] || f.kind;
      return '<li><span class="when mono">' + esc(f.when) + '</span><div class="what"><span class="tag ' + esc(f.kind) + '">' + tag + '</span>' + t + (f.sub ? '<small>' + esc(f.sub) + '</small>' : "") + '</div></li>';
    }).join("") + '</ul>';
    var body = '<div class="body"><div class="ph"><p class="big serif">' + headline + '</p><span class="since mono">' + P.timeline.total + ' citing works since ' + esc(P.timeline.since) + '</span></div>' + spark + feed + '</div>';
    return frame("Live · updated " + fmtDate(P.updated), body, (P.sources.slice(0, 2).join(" · ") || "OpenAlex") + "<br>" + wordmark + " · refreshed nightly", "Follow this " + P.kind + "'s story", "#whos-citing", "pulse");
  }

  var render = { storyline: renderStoryline, audiences: renderAudiences, pulse: renderPulse }[variant] || renderStoryline;
  document.getElementById("root").innerHTML = render();
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  setTimeout(sendHeight, 50); setTimeout(sendHeight, 400);
})();
</script>
</body>
